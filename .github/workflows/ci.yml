name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Syntax check
        run: npm run check

      - name: Build CSS
        run: npm run build

      - name: Verify build output
        run: test -s public/css/style.css

      - name: Privacy scan (absolute paths / internal ids)
        run: |
          if grep -rInE 'C:\\Users|D:\\projects|Cen[k]T|home/[a-z]+/|note[_]id' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=archive .; then
            echo "::error::Kişisel yol veya iç kimlik tespit edildi"
            exit 1
          fi
